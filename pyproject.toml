[tool.poetry]
name = "labot"
version = "0.1.0"
description = "Labot (LAboratory BOT) supports handbook organizing, teaching, research etc."
authors = ["Gerit Wagner <gerit.wagner@uni-bamberg.de>"]
license = "MIT"
readme = "README.md"
packages = [{include = "labot"}]

[tool.poetry.dependencies]
python = ">=3.10, <3.13"
gitpython = "^3.1.43"
click = "^8.1.7"
pre-commit = "^3.2.0"
colrev-sync = "0.2.0"
docx-mailmerge = "^0.5.0"
pygithub = "^2.5.0"
python-docx = "^1.1.2"
inquirer = "^3.4.0"
pandas = "^2.2.3"
yamale = "^5.2.1"
openai = "^1.58.1"
pypdf2 = "^3.0.1"
colrev = "^0.14.0"
jinja2 = "^3.1.5"
exchangelib = "^5.5.0"
pdfannots = "^0.5"
language-tool-python = "^2.9.4"

[tool.poetry.scripts]
labot = "labot.cli:main"

[tool.mypy]
python_version = 3.9
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "requests.*",
    "yaml.*",
    "pkg_resources.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
